version: '3.8'

services:
  mcattributes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcattributes
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppConfigConnectionString=Endpoint=https://aadc-webservice-config.azconfig.io;Id=PNaY-l1-s0:GIsKQnTDfxgSFcCJ6g2m;Secret=OuhZFitpCJaBwgw4gSL694U8MTHERjv0bucRlvaShsI=
      - InitializeDatabaseWhenMissing=true
      - ForceHttpsScheme=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mcattributes-db
    environment:
      - POSTGRES_DB=mcattributes
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourSecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
